<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla grant received</title>
<style>body{font-family:system-ui;background:#181818;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0}
main{max-width:34rem;padding:2rem;text-align:center}code{word-break:break-all;background:#000;padding:.5rem .75rem;border-radius:.5rem;display:block;margin:1rem 0;font-size:.8rem}
button{font:inherit;background:#e8232a;color:#fff;border:0;border-radius:.5rem;padding:.6rem 1.2rem;cursor:pointer}</style></head>
<body><main><h1>✅ Grant received</h1><p>Your authorization code arrived at <em>borealbytes.github.io</em>:</p>
<code id="c">(no code in URL)</code><button onclick="copy()">Copy code</button>
<p style="opacity:.6;font-size:.85rem;margin-top:1.5rem">You can close this tab once the app confirms.</p></main>
<script>
var c=new URLSearchParams(location.search).get('code')||'(no code in URL)';
document.getElementById('c').textContent=c;
function copy(){navigator.clipboard.writeText(c)}
</script></body></html>
